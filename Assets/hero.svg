  <!-- Fondo decorativo -->
  <circle cx="440" cy="90" r="120" fill="url(#g2)" opacity="0.15"/>
  <circle cx="90" cy="400" r="100" fill="#0B2545" opacity="0.06"/>

  <!-- Tarjeta principal (navegador) -->
  <rect x="70" y="90" width="420" height="270" rx="18" fill="#fff" stroke="#E3E9F0" stroke-width="2"/>
  <rect x="70" y="90" width="420" height="46" rx="18" fill="url(#g1)"/>
  <rect x="70" y="118" width="420" height="18" fill="url(#g1)"/>
  <circle cx="98" cy="113" r="6" fill="#4FC3F7"/>
  <circle cx="118" cy="113" r="6" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="138" cy="113" r="6" fill="#FFFFFF" opacity="0.3"/>

  <!-- Contenido simulado -->
  <rect x="100" y="165" width="180" height="16" rx="8" fill="#0B2545" opacity="0.85"/>
  <rect x="100" y="195" width="260" height="10" rx="5" fill="#E3E9F0"/>
