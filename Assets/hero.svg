  <circle cx="375" cy="310" r="5" fill="#0B2545"/>
  <circle cx="405" cy="280" r="5" fill="#0B2545"/>
  <circle cx="430" cy="295" r="5" fill="#0B2545"/>
  <circle cx="455" cy="235" r="6" fill="#1FA2A6"/>

  <!-- Barra de progreso -->
  <rect x="360" y="345" width="110" height="8" rx="4" fill="#E3E9F0"/>
  <rect x="360" y="345" width="78" height="8" rx="4" fill="#1FA2A6"/>
