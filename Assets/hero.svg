      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#1FA2A6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
